version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: veloop-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veloop-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/veloop_rewards?replicaSet=rs0
      - JWT_SECRET=demo_docker_jwt_secret_key_987654321_veloop
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
      - ADMIN_BOOTSTRAP_EMAIL=admin@veloop.test
      - ADMIN_BOOTSTRAP_PASSWORD=AdminPass123!
      - DAILY_WITHDRAWAL_CAP_VES=200000
      - MAX_WITHDRAWAL_ATTEMPTS_PER_HOUR=5
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veloop-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo-data:

